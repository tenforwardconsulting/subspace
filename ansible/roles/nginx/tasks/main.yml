- name: Add official Nginx repo
  ansible.builtin.deb822_repository:
    name: nginx
    types: [deb]
    uris: "https://nginx.org/packages/ubuntu"
    components: [nginx]
    suites: [ "{{ ansible_facts['distribution_release'] }}" ]
    signed_by: https://nginx.org/keys/nginx_signing.key
    state: present
    enabled: true
  register: nginx_apt

- name: Update package cache if nginx repo was added
  become: yes
  when: nginx_apt.changed
  apt:
    update_cache: yes

- name: Pin nginx.org packages over distribution packages
  copy:
    content: |
      Package: *
      Pin: origin nginx.org
      Pin: release o=nginx
      Pin-Priority: 900
    dest: /etc/apt/preferences.d/99nginx
  become: true

- name: Install nginx from official repo
  apt:
    pkg: nginx
    state: latest
    update_cache: yes
    cache_valid_time: 3600
  become: true

- name: Remove default nginx config files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/conf.d/default.conf
  become: true

- name: Ensure sites-available directory exists
  file:
    path: /etc/nginx/sites-available
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Ensure sites-enabled directory exists
  file:
    path: /etc/nginx/sites-enabled
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Ensure modules-enabled directory exists
  file:
    path: /etc/nginx/modules-enabled
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Deploy nginx.conf
  template:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
  become: true

- name: "Configure rails projects"
  import_role:
    name: nginx-rails

- name: create nginx status config
  template:
    src: status
    dest: /etc/nginx/sites-available/status
  become: true

- name: enable nginx status
  file:
    src: /etc/nginx/sites-available/status
    dest: /etc/nginx/sites-enabled/status
    state: link
  become: true

- name: Restart nginx (systemd)
  become: true
  systemd:
    state: restarted
    daemon_reload: yes
    name: nginx

- name: Enable nginx to start on reboot
  become: true
  systemd:
    name: nginx
    enabled: true

- name: Nginx is installed
  set_fact:
    nginx_installed: true
