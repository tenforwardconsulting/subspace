- name: Remove ondrej nginx packages before switching to official repo
  apt:
    pkg:
      - nginx
      - nginx-common
      - nginx-core
      - nginx-full
    state: absent
    purge: no
  become: true

- name: Install nginx from official repo
  apt:
    pkg: nginx
    state: latest
    update_cache: yes
  become: true

- name: Remove default nginx config files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/conf.d/default.conf
  become: true

- name: Ensure sites-available directory exists
  file:
    path: /etc/nginx/sites-available
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Ensure sites-enabled directory exists
  file:
    path: /etc/nginx/sites-enabled
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Ensure modules-enabled directory exists
  file:
    path: /etc/nginx/modules-enabled
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Deploy nginx.conf
  template:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
  become: true

- name: "Configure rails projects"
  import_role:
    name: nginx-rails

- name: create nginx status config
  template:
    src: status
    dest: /etc/nginx/sites-available/status
  become: true

- name: enable nginx status
  file:
    src: /etc/nginx/sites-available/status
    dest: /etc/nginx/sites-enabled/status
    state: link
  become: true

- name: Restart nginx (systemd)
  become: true
  systemd:
    state: restarted
    daemon_reload: yes
    name: nginx

- name: Enable nginx to start on reboot
  become: true
  systemd:
    name: nginx
    enabled: true

- name: Nginx is installed
  set_fact:
    nginx_installed: true
