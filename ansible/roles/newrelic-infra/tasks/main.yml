---
  - name: Add NewRelic official APT repository
    ansible.builtin.deb822_repository:
      name: newrelic
      types: [deb]
      uris: "https://download.newrelic.com/infrastructure_agent/linux/apt/"
      components: [binary]
      signed_by: https://download.newrelic.com/infrastructure_agent/gpg/newrelic-infra.gpg
      state: present
      enabled: true

  - name: create license key
    copy:
      dest: "/etc/newrelic-infra.yml"
      content: |
        license_key: {{newrelic_license}}

  - name: Install New Relic server agent
    apt:
      pkg: newrelic-infra
      state: present
      update_cache: true
    become: true

  - name: Configure application log forwarding if enabled
    when: newrelic_logs | length > 0
    become: true
    template:
      dest: "/etc/newrelic-infra/logging.d/subspace.yml"
      src: logs.yml.j2
    notify: Restart newrelic-infra
