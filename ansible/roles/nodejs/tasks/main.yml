---
- name: Add NodeSource repositories for Node.js.
  ansible.builtin.deb822_repository:
    name: node_repo
    types: [deb]
    uris: "https://deb.nodesource.com/node_{{ nodejs_version }}/"
    components: [main]
    suites: [nodistro]
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present
    enabled: true

# Newer Ubuntu archives carry a higher nodejs than older NodeSource majors, and
# `apt upgrade` would otherwise swap the NodeSource build out for it.
- name: Prefer NodeSource's nodejs over the distro's.
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/nodejs
    content: |
      Package: nodejs
      Pin: origin deb.nodesource.com
      Pin-Priority: 600

