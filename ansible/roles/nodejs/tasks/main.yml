---
- name: Add NodeSource repositories for Node.js.
  ansible.builtin.deb822_repository:
    name: node_repo
    types: [deb]
    uris: "https://deb.nodesource.com/node_{{ nodejs_version }}/"
    components: [main]
    suites: [nodistro]
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present
    enabled: true

