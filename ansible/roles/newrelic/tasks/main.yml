---
  - name: "Deprecation notice"
    ansible.builtin.debug:
      msg: The 'newrelic' role in subspace is deprecated. Please migration to Newrelic One and the 'newrelic-infra' role

  - name: Remove legacy New Relic apt list if present
    ansible.builtin.file:
      path: /etc/apt/sources.list.d/apt_newrelic_com_debian.list
      state: absent
    become: true

  - name: Add New Relic apt repo
    ansible.builtin.deb822_repository:
      name: newrelic
      types: [deb]
      uris: "http://apt.newrelic.com/debian/"
      suites: [newrelic]
      components: [non-free]
      signed_by: https://download.newrelic.com/548C16BF.gpg
      state: present
    become: true

  - name: Install New Relic server agent
    apt:
      pkg: newrelic-sysmond
      state: present
      update_cache: true
    become: true

  - shell: "nrsysmond-config --set license_key={{newrelic_licence}}"
    become: true
    notify: start newrelic agent
