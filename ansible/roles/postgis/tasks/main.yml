---
- name: Remove legacy PostgreSQL apt list if present
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/apt_postgresql_org_pub_repos_apt.list
    state: absent

- name: Add PostgreSQL official APT repository
  ansible.builtin.deb822_repository:
    name: postgresql
    types: [deb]
    uris: "http://apt.postgresql.org/pub/repos/apt/"
    suites: [ "{{ ansible_facts['distribution_release'] }}-pgdg" ]
    components: [main]
    signed_by: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present
    enabled: true

- name: Install PostGIS
  apt: pkg={{ item }} state=present
  with_items:
    - postgresql-{{ postgresql_version }}-postgis-{{ postgis_version }}

- name: "Enable postgres postgis"
  become: true
  become_user: postgres
  postgresql_ext:
    login_db: "{{database_name}}"
    name: postgis
    state: present
