---
# Undoes upgrade_quiesce.yml, so an aborted upgrade leaves the old server serving again.
- name: Start puma, the workers and cron
  hosts: "{{ upgrade_host }}"
  gather_facts: false
  become: true
  tasks:
    - name: Read the units upgrade_quiesce.yml stopped
      command: cat /opt/subspace/upgrade-stopped-units
      changed_when: false
      failed_when: false
      register: stopped_units

    - name: Start the stopped units
      systemd:
        name: "{{ item }}"
        state: started
      loop: "{{ stopped_units.stdout_lines }}"

    - name: Forget the stopped units
      file:
        path: /opt/subspace/upgrade-stopped-units
        state: absent
