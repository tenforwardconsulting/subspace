---
# Seeds the new host with the existing certificates before it is provisioned, so the
# letsencrypt role finds a cert that is not due for renewal and nginx starts with TLS.
- name: Archive /etc/letsencrypt from the old host
  hosts: "{{ upgrade_host }}"
  gather_facts: false
  become: true
  tasks:
    - when: ssl_enabled | default(false)
      block:
        - name: Create the archive
          command: tar czf /tmp/letsencrypt.tar.gz -C /etc letsencrypt

        - name: Fetch the archive
          fetch:
            src: /tmp/letsencrypt.tar.gz
            dest: "{{ letsencrypt_archive }}"
            flat: true

        - name: Remove the archive from the old host
          file:
            path: /tmp/letsencrypt.tar.gz
            state: absent

- name: Unpack /etc/letsencrypt on the new host
  hosts: "{{ letsencrypt_destination }}"
  gather_facts: false
  become: true
  tasks:
    - when: ssl_enabled | default(false)
      block:
        - name: Upload the archive
          copy:
            src: "{{ letsencrypt_archive }}"
            dest: /tmp/letsencrypt.tar.gz
            mode: "0600"

        - name: Unpack it
          unarchive:
            src: /tmp/letsencrypt.tar.gz
            dest: /etc
            remote_src: true

        - name: Remove the archive
          file:
            path: /tmp/letsencrypt.tar.gz
            state: absent
